name: stockreal
services:
  dev:
    image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    working_dir: /workspace
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    environment:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - .:/workspace
  dashboard:
    image: python:3.12-slim@sha256:78387bc3881b8273120a12ebe6c1ab22b018ccc2c9adf565ae1ac9b536e184ea
    working_dir: /workspace
    command: ["python", "-m", "stockreal.dashboard"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TZ: Asia/Shanghai
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:18080:18080"
    volumes:
      - ./stockreal:/workspace/stockreal:ro
      - ./web:/workspace/web:ro
      - ./config:/workspace/config:ro
      - ./contracts:/workspace/contracts:ro
      - ./docs:/workspace/docs:ro
      - ./data:/workspace/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
